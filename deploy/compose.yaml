# StayZim on one server: web (landing page, dashboard, lodge sites), the API and
# Postgres. Made for Coolify's "Docker Compose" build pack; plain `docker compose`
# works too. Settings come from the environment (deploy/.env.example lists them).
# Full guide: docs/deployment.md
#
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build

name: stayzim

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # Baked into the browser bundle: changing them needs a rebuild
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?Set NEXT_PUBLIC_SERVER_URL, e.g. https://api.stayzim.co.zw}
        NEXT_PUBLIC_SITES_DOMAIN: ${NEXT_PUBLIC_SITES_DOMAIN:-stayzim.co.zw}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    image: stayzim-web
    restart: unless-stopped
    environment:
      # Lodge site pages fetch their content from the API inside this network
      SERVER_INTERNAL_URL: http://server:9998
    expose:
      - "9999"
    depends_on:
      server:
        condition: service_healthy
    labels:
      # Lodge sites: every {slug}.stayzim.co.zw goes to web. Coolify routes the
      # domains you give the service (stayzim.co.zw, app.stayzim.co.zw); these
      # catch-alls come last (priorities 2 and 1), so api. and app. keep their own routes.
      # Change the domain in the rule if SITES_DOMAIN differs.
      - traefik.enable=true
      - traefik.http.routers.stayzim-sites.rule=HostRegexp(`^[a-z0-9-]+\.stayzim\.co\.zw$`)
      - traefik.http.routers.stayzim-sites.priority=2
      - traefik.http.routers.stayzim-sites.entrypoints=https
      - traefik.http.routers.stayzim-sites.tls=true
      - traefik.http.routers.stayzim-sites.service=stayzim-sites
      - traefik.http.services.stayzim-sites.loadbalancer.server.port=9999
      # Lodges' own domains (mistvalleylodge.co.zw) through Cloudflare for SaaS: any
      # other host goes to web, last of all (priority 1), and the app works out which
      # lodge it is. Unknown hosts get the "lodge not found" page.
      - traefik.http.routers.stayzim-custom-domains.rule=HostRegexp(`.+`)
      - traefik.http.routers.stayzim-custom-domains.priority=1
      - traefik.http.routers.stayzim-custom-domains.entrypoints=https
      - traefik.http.routers.stayzim-custom-domains.tls=true
      - traefik.http.routers.stayzim-custom-domains.service=stayzim-sites

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: stayzim-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://stayzim:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/stayzim
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.stayzim.co.zw,https://stayzim.co.zw}
      SITES_DOMAIN: ${SITES_DOMAIN:-stayzim.co.zw}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.stayzim.co.zw}
      WEB_URL: ${WEB_URL:-https://app.stayzim.co.zw}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.stayzim.co.zw}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-cf-connecting-ip}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PAYNOW_INTEGRATION_ID: ${PAYNOW_INTEGRATION_ID:-}
      PAYNOW_INTEGRATION_KEY: ${PAYNOW_INTEGRATION_KEY:-}
      PAYNOW_AUTH_EMAIL: ${PAYNOW_AUTH_EMAIL:-}
      ECOCASH_MERCHANT_CODE: ${ECOCASH_MERCHANT_CODE:-}
      INNBUCKS_MERCHANT_CODE: ${INNBUCKS_MERCHANT_CODE:-}
      BUSINESS_NAME: ${BUSINESS_NAME:-StayZim}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-Mutare, Zimbabwe}
      BUSINESS_EMAIL: ${BUSINESS_EMAIL:-hello@stayzim.co.zw}
      BUSINESS_TAX_NUMBER: ${BUSINESS_TAX_NUMBER:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "9998"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayzim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: stayzim
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayzim -d stayzim"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres:
