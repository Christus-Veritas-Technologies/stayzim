# StayZim on one server: web (landing page, dashboard, lodge sites), the API, the
# admin app (with the WhatsApp outreach) and Postgres. Made for Coolify's "Docker
# Compose" build pack; plain `docker compose` works too. Settings come from the
# environment (deploy/.env.example lists them); POSTGRES_PASSWORD and
# BETTER_AUTH_SECRET have no default and must be set.
# No ${VAR:?message} here: Coolify reads the message as the value.
# Full guide: docs/deployment.md
#
# Paths are from the repository root, as Coolify runs it (--project-directory is
# the repo). Locally, from the repo root:
#
#   docker compose -f deploy/compose.yaml --project-directory . --env-file deploy/.env up -d --build

name: stayzim

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Baked into the browser bundle: changing them needs a rebuild
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://api.stayzim.co.zw}
        NEXT_PUBLIC_SITES_DOMAIN: ${NEXT_PUBLIC_SITES_DOMAIN:-stayzim.co.zw}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    restart: unless-stopped
    environment:
      # Lodge site pages fetch their content from the API inside this network
      SERVER_INTERNAL_URL: http://server:9998
      # Served at /indexnow-key.txt; the same value as the API's
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
    expose:
      - "9999"
    depends_on:
      server:
        condition: service_healthy
    labels:
      # Lodge sites: every host without a route of its own goes to web, last of
      # all (priority 1), and the app works out which lodge it is from the host:
      # {slug}.stayzim.co.zw, or a lodge's own domain (mistvalleylodge.co.zw)
      # through Cloudflare for SaaS. Unknown hosts get "lodge not found".
      # Coolify routes the domains you give the services (stayzim.co.zw, www.,
      # api.) with higher priority, so they keep their own routes.
      # PathPrefix(`/`) reads the same in Traefik v2 and v3; a HostRegexp rule
      # doesn't (v2 never matched the old one, so lodge sites got a 404).
      - traefik.enable=true
      - traefik.http.routers.stayzim-sites.rule=PathPrefix(`/`)
      - traefik.http.routers.stayzim-sites.priority=1
      - traefik.http.routers.stayzim-sites.entrypoints=https
      - traefik.http.routers.stayzim-sites.tls=true
      - traefik.http.routers.stayzim-sites.service=stayzim-sites
      - traefik.http.services.stayzim-sites.loadbalancer.server.port=9999

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://stayzim:${POSTGRES_PASSWORD}@db:5432/stayzim
      CORS_ORIGIN: ${CORS_ORIGIN:-https://stayzim.co.zw}
      SITES_DOMAIN: ${SITES_DOMAIN:-stayzim.co.zw}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.stayzim.co.zw}
      WEB_URL: ${WEB_URL:-https://stayzim.co.zw}
      # The admin app: allowed to call the API with the team's login
      ADMIN_URL: ${ADMIN_URL:-https://admin.stayzim.co.zw}
      # StayZim's own team login for the admin app, created on start if it doesn't
      # exist yet (never changed after that). Its password is ADMIN_API_TOKEN.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-hello@stayzim.co.zw}
      ADMIN_PASSWORD: ${ADMIN_API_TOKEN:-}
      # Scripts (and Claude) call /api/admin/* with "Authorization: Bearer <ADMIN_API_TOKEN>",
      # acting as that team login
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.stayzim.co.zw}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-cf-connecting-ip}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BILLING_SMTP_HOST: ${BILLING_SMTP_HOST:-}
      BILLING_SMTP_PORT: ${BILLING_SMTP_PORT:-}
      BILLING_SMTP_USER: ${BILLING_SMTP_USER:-}
      BILLING_SMTP_PASS: ${BILLING_SMTP_PASS:-}
      BILLING_SMTP_FROM: ${BILLING_SMTP_FROM:-}
      PAYNOW_INTEGRATION_ID: ${PAYNOW_INTEGRATION_ID:-}
      PAYNOW_INTEGRATION_KEY: ${PAYNOW_INTEGRATION_KEY:-}
      DOMAIN_STILL_FREE: ${DOMAIN_STILL_FREE:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "9998"
    depends_on:
      db:
        condition: service_healthy

  # The team's app at admin.stayzim.co.zw: leads, sites made for them, every
  # site, user and payment, and the WhatsApp outreach (one Chromium per number,
  # inside this container). Team accounts sign in with their StayZim login; the
  # API checks the role. It uses the main database; WhatsApp logins are kept
  # there, so a redeploy needs no new QR scans.
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      # Baked into the browser bundle: changing them needs a rebuild
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://api.stayzim.co.zw}
        NEXT_PUBLIC_WEB_URL: ${WEB_URL:-https://stayzim.co.zw}
        NEXT_PUBLIC_SITES_DOMAIN: ${NEXT_PUBLIC_SITES_DOMAIN:-stayzim.co.zw}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://stayzim:${POSTGRES_PASSWORD}@db:5432/stayzim
      # Its own address (the database package reads the API's settings too)
      CORS_ORIGIN: ${ADMIN_URL:-https://admin.stayzim.co.zw}
      # Checks who's signed in with the API inside this network
      SERVER_INTERNAL_URL: http://server:9998
      # For scripts calling /api/outreach/* ("Authorization: Bearer ..."); empty:
      # signed-in team members only
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      WHATSAPP_ACCOUNTS: ${WHATSAPP_ACCOUNTS:-wa1,wa2,wa3}
      WHATSAPP_DAILY_LIMIT: ${WHATSAPP_DAILY_LIMIT:-40}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      # The WhatsApp sales agent (docs/sales-agent.md): OpenRouter for its models, the
      # numbers it answers on, and its starting mode (the admin's switch overrides it)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AGENT_ACCOUNTS: ${AGENT_ACCOUNTS:-wa1}
      AGENT_MODE: ${AGENT_MODE:-off}
      AGENT_MODEL: ${AGENT_MODEL:-anthropic/claude-haiku-5.5}
      AGENT_FALLBACK_MODEL: ${AGENT_FALLBACK_MODEL:-openai/gpt-6-luna}
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-1.14}
      # Once, after the old outreach app: copies its leads, messages and WhatsApp
      # logins from its database (stayzim-outreach) while the main one has none
      OUTREACH_IMPORT_DATABASE_URL: postgresql://stayzim:${POSTGRES_PASSWORD}@db:5432/stayzim-outreach
    expose:
      - "9996"
    # One Chromium per number (about 300 MB each), and Chromium outgrows
    # Docker's 64 MB /dev/shm
    shm_size: 1gb
    # Time to save each session to Postgres and close Chromium on a redeploy
    stop_grace_period: 30s
    # The API applies the database migrations first
    depends_on:
      server:
        condition: service_healthy
    labels:
      # Its own route, so it doesn't depend on a domain being entered for it in
      # Coolify (without one, web's catch-all above would take the host)
      - traefik.enable=true
      - traefik.http.routers.stayzim-admin.rule=Host(`${ADMIN_DOMAIN:-admin.stayzim.co.zw}`)
      - traefik.http.routers.stayzim-admin.priority=100
      - traefik.http.routers.stayzim-admin.entrypoints=https
      - traefik.http.routers.stayzim-admin.tls=true
      - traefik.http.routers.stayzim-admin.service=stayzim-admin
      - traefik.http.services.stayzim-admin.loadbalancer.server.port=9996

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayzim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stayzim
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayzim -d stayzim"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres:
